services:
  server:
    image: ghcr.io/sim007/showcase-website/server:${TAG:-first-mvp}
    ports:
      - "4000:4000"
    volumes:
      - ./content:/app/content
    environment:
      - PORT=4000

  client:
    image: ghcr.io/sim007/showcase-website/client:${TAG:-first-mvp}
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=http://localhost:4000
    depends_on:
      - server
