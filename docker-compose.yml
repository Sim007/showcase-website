services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "4000:4000"
    volumes:
      - ./content:/app/content
    environment:
      - PORT=4000

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=http://localhost:4000
      - VITE_CBT_BASE=${CBT_BASE:-http://localhost:8090}
    depends_on:
      - server
